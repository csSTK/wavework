name: CI

# Tests run on dev only: pushes to dev and pull requests into dev. prd receives dev's commits
# by pull request, and publish.yml runs the tests again for a release tag.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    # Skip the push run of a merged pull request (merge or squash commit made by GitHub, committer `web-flow`):
    # the pull request already ran these checks. Direct pushes still run. Quoted: an unquoted ` #` starts a YAML comment.
    if: "${{ github.event_name != 'push' || github.event.head_commit.committer.username != 'web-flow' || (!startsWith(github.event.head_commit.message, 'Merge pull request #') && !contains(github.event.head_commit.message, '(#')) }}"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  smoke:
    # Skip the push run of a merged pull request (merge or squash commit made by GitHub, committer `web-flow`):
    # the pull request already ran these checks. Direct pushes still run. Quoted: an unquoted ` #` starts a YAML comment.
    if: "${{ github.event_name != 'push' || github.event.head_commit.committer.username != 'web-flow' || (!startsWith(github.event.head_commit.message, 'Merge pull request #') && !contains(github.event.head_commit.message, '(#')) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bash scripts/smoke.sh
